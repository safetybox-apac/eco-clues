<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3e10c"><title>Eco Clues</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="eco.css"><script src="audio.js" defer></script><script src="app.js" defer></script></head><body><header><div class="brand">AIRBUS <button id="settingsButton" class="icon" aria-label="Open sound settings">⚙</button></div><span>ECO CLUES · FOUR PICTURES, ONE WORD</span></header><main id="app"><p>Preparing Eco Clues…</p></main><div id="announcement" class="sr" role="status"></div><div id="toast" role="status"></div><dialog id="settings" aria-labelledby="soundTitle"><div class="spread"><h2 id="soundTitle">Sound settings</h2><button id="closeSettings" class="icon" aria-label="Close settings">✕</button></div><label class="check"><input id="music" type="checkbox" checked> Background music</label><label class="check"><input id="effects" type="checkbox" checked> Sound effects</label></dialog><dialog id="zoom" aria-labelledby="zoomTitle"><div class="spread"><h2 id="zoomTitle">Look closer</h2><button id="closeZoom" class="icon" aria-label="Close enlarged picture">✕</button></div><div id="zoomImage"></div><p class="hint">AI generated — for illustration purposes only.</p></dialog><dialog id="confirm"><h2>Finish this game?</h2><p>Unsolved puzzles earn no points. You can reveal their answers after finishing.</p><div class="actions"><button id="continueGame">Keep playing</button><button id="finishNow" class="primary">Finish game</button></div></dialog></body></html>
